<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>agent-watch — Dashboard</title>
  <style>
    :root {
      --bg:        #0d0f14;
      --surface:   #151820;
      --border:    #1e2433;
      --accent:    #3b82f6;
      --accent-dim:#1d4ed8;
      --ok:        #22c55e;
      --error:     #ef4444;
      --running:   #f59e0b;
      --text:      #e2e8f0;
      --text-dim:  #64748b;
      --mono:      'JetBrains Mono', 'Fira Code', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      min-height: 100vh;
    }

    /* ── Layout ───────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: -0.3px;
    }

    .logo-icon {
      width: 28px;
      height: 28px;
      background: var(--accent);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .header-meta {
      font-size: 12px;
      color: var(--text-dim);
    }

    .main {
      display: grid;
      grid-template-columns: 360px 1fr;
      height: calc(100vh - 55px);
      overflow: hidden;
    }

    /* ── Sidebar ──────────────────────────────────────── */
    .sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .filters {
      padding: 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .filters-row {
      display: flex;
      gap: 8px;
    }

    select, input {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 6px 10px;
      font-size: 12px;
      outline: none;
      width: 100%;
    }

    select:focus, input:focus {
      border-color: var(--accent);
    }

    .btn {
      background: var(--accent);
      border: none;
      border-radius: 6px;
      color: #fff;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      white-space: nowrap;
    }

    .btn:hover { background: var(--accent-dim); }
    .btn.secondary { background: var(--border); color: var(--text); }
    .btn.secondary:hover { background: #2a3040; }

    .trace-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .trace-item {
      border-radius: 8px;
      cursor: pointer;
      padding: 10px 12px;
      margin-bottom: 4px;
      border: 1px solid transparent;
      transition: background 0.1s, border-color 0.1s;
    }

    .trace-item:hover { background: var(--bg); }

    .trace-item.active {
      background: var(--bg);
      border-color: var(--accent);
    }

    .trace-item-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .trace-name {
      font-weight: 600;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 200px;
    }

    .status-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .status-badge.ok      { background: #14532d; color: var(--ok); }
    .status-badge.error   { background: #450a0a; color: var(--error); }
    .status-badge.running { background: #451a03; color: var(--running); }

    .trace-meta {
      font-size: 11px;
      color: var(--text-dim);
      display: flex;
      gap: 8px;
    }

    /* ── Stats bar ────────────────────────────────────── */
    .stats-bar {
      display: flex;
      gap: 1px;
      background: var(--border);
      border-bottom: 1px solid var(--border);
    }

    .stat-card {
      flex: 1;
      background: var(--surface);
      padding: 12px 16px;
    }

    .stat-label {
      font-size: 11px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 22px;
      font-weight: 700;
    }

    .stat-value.error { color: var(--error); }
    .stat-value.ok    { color: var(--ok); }

    /* ── Detail pane ──────────────────────────────────── */
    .detail {
      overflow-y: auto;
      padding: 20px 24px;
    }

    .empty-state {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      gap: 8px;
    }

    .empty-icon { font-size: 40px; }

    .detail-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .detail-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .detail-meta {
      font-size: 12px;
      color: var(--text-dim);
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--text-dim);
      margin-bottom: 10px;
      margin-top: 24px;
    }

    /* ── Span tree ────────────────────────────────────── */
    .span-tree {
      font-family: var(--mono);
      font-size: 12px;
    }

    .span-node {
      position: relative;
    }

    .span-row {
      display: flex;
      align-items: center;
      padding: 5px 8px;
      border-radius: 6px;
      gap: 8px;
      cursor: default;
    }

    .span-row:hover { background: var(--border); }

    .span-indent {
      color: var(--border);
      user-select: none;
      letter-spacing: -2px;
    }

    .span-icon { width: 14px; text-align: center; flex-shrink: 0; }
    .span-icon.ok      { color: var(--ok); }
    .span-icon.error   { color: var(--error); }
    .span-icon.running { color: var(--running); }

    .span-name { flex: 1; color: var(--text); }
    .span-name.error { color: var(--error); }

    .span-duration {
      color: var(--text-dim);
      font-size: 11px;
      flex-shrink: 0;
    }

    .span-attrs {
      padding: 2px 8px 4px calc(8px + 22px);
      font-size: 11px;
      color: var(--text-dim);
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .attr-tag {
      background: var(--border);
      border-radius: 4px;
      padding: 1px 6px;
    }

    .attr-key { color: var(--text-dim); }
    .attr-val { color: var(--accent); }

    .span-error-msg {
      padding: 2px 8px 6px calc(8px + 22px);
      font-size: 11px;
      color: var(--error);
    }

    /* ── Scrollbar ────────────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #2d3748; }

    /* ── Loading ──────────────────────────────────────── */
    .loading {
      color: var(--text-dim);
      font-size: 12px;
      text-align: center;
      padding: 24px;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">👁</div>
    agent-watch
  </div>
  <div class="header-meta" id="header-meta">Loading…</div>
</header>

<div class="main">
  <!-- ── Sidebar ─────────────────────────────────── -->
  <div class="sidebar">
    <div class="filters">
      <div class="filters-row">
        <select id="filter-agent">
          <option value="">All agents</option>
        </select>
        <select id="filter-status">
          <option value="">All statuses</option>
          <option value="ok">OK</option>
          <option value="error">Error</option>
          <option value="running">Running</option>
        </select>
      </div>
      <div class="filters-row">
        <select id="filter-since">
          <option value="1">Last 1h</option>
          <option value="6">Last 6h</option>
          <option value="24" selected>Last 24h</option>
          <option value="168">Last 7d</option>
          <option value="720">Last 30d</option>
        </select>
        <button class="btn" id="btn-refresh">Refresh</button>
      </div>
    </div>
    <div class="trace-list" id="trace-list">
      <div class="loading">Loading traces…</div>
    </div>
  </div>

  <!-- ── Main pane ──────────────────────────────── -->
  <div style="display:flex;flex-direction:column;overflow:hidden;">
    <div class="stats-bar" id="stats-bar">
      <div class="stat-card">
        <div class="stat-label">Total Traces</div>
        <div class="stat-value" id="stat-total">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Error Rate</div>
        <div class="stat-value" id="stat-errors">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Avg Duration</div>
        <div class="stat-value" id="stat-avg">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Last Hour</div>
        <div class="stat-value" id="stat-recent">—</div>
      </div>
    </div>
    <div class="detail" id="detail">
      <div class="empty-state">
        <div class="empty-icon">🔭</div>
        <div>Select a trace to inspect</div>
      </div>
    </div>
  </div>
</div>

<script>
  const API = '';
  let currentTraceId = null;
  let allTraces = [];

  // ── Helpers ──────────────────────────────────────────────────

  function fmt(ms) {
    if (!ms && ms !== 0) return '—';
    if (ms < 1000) return ms + 'ms';
    if (ms < 60000) return (ms / 1000).toFixed(1) + 's';
    return (ms / 60000).toFixed(1) + 'm';
  }

  function timeAgo(ts) {
    const diff = Date.now() - ts;
    if (diff < 60000) return Math.round(diff / 1000) + 's ago';
    if (diff < 3600000) return Math.round(diff / 60000) + 'm ago';
    if (diff < 86400000) return Math.round(diff / 3600000) + 'h ago';
    return new Date(ts).toLocaleDateString();
  }

  function esc(str) {
    return String(str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Fetch ─────────────────────────────────────────────────────

  async function fetchJSON(url) {
    const r = await fetch(url);
    if (!r.ok) throw new Error(r.statusText);
    return r.json();
  }

  // ── Render traces list ────────────────────────────────────────

  async function loadTraces() {
    const agent  = document.getElementById('filter-agent').value;
    const status = document.getElementById('filter-status').value;
    const since  = document.getElementById('filter-since').value;

    let url = `${API}/api/traces?limit=100&since=${since}`;
    if (agent)  url += `&agent=${encodeURIComponent(agent)}`;
    if (status) url += `&status=${encodeURIComponent(status)}`;

    document.getElementById('trace-list').innerHTML = '<div class="loading">Loading…</div>';

    const data = await fetchJSON(url);
    allTraces = data.traces;
    renderTraceList(allTraces);
  }

  function renderTraceList(traces) {
    const el = document.getElementById('trace-list');
    if (!traces.length) {
      el.innerHTML = '<div class="loading">No traces found.</div>';
      return;
    }

    el.innerHTML = traces.map(t => {
      const dur = t.end_time ? fmt(t.end_time - t.start_time) : '…';
      const active = t.id === currentTraceId ? ' active' : '';
      return `
        <div class="trace-item${active}" onclick="selectTrace('${t.id}')">
          <div class="trace-item-header">
            <div class="trace-name" title="${esc(t.name)}">${esc(t.name)}</div>
            <span class="status-badge ${t.status}">${t.status}</span>
          </div>
          <div class="trace-meta">
            <span>${esc(t.agentName)}</span>
            <span>${dur}</span>
            <span>${timeAgo(t.startTime)}</span>
          </div>
        </div>`;
    }).join('');
  }

  // ── Render stats ──────────────────────────────────────────────

  async function loadStats() {
    const since = document.getElementById('filter-since').value;
    const data = await fetchJSON(`${API}/api/stats?since=${since}`);

    document.getElementById('stat-total').textContent  = data.totalTraces;
    const errPct = (data.errorRate * 100).toFixed(1) + '%';
    const errEl = document.getElementById('stat-errors');
    errEl.textContent = errPct;
    errEl.className = 'stat-value ' + (data.errorRate > 0.05 ? 'error' : 'ok');
    document.getElementById('stat-avg').textContent    = fmt(data.avgDurationMs);
    document.getElementById('stat-recent').textContent = data.recentTraces;
    document.getElementById('header-meta').textContent =
      `${data.totalTraces} traces · ${errPct} errors`;
  }

  // ── Load agents for filter ────────────────────────────────────

  async function loadAgents() {
    const data = await fetchJSON(`${API}/api/agents`);
    const sel = document.getElementById('filter-agent');
    data.agents.forEach(a => {
      const opt = document.createElement('option');
      opt.value = a;
      opt.textContent = a;
      sel.appendChild(opt);
    });
  }

  // ── Select trace ──────────────────────────────────────────────

  async function selectTrace(id) {
    currentTraceId = id;
    // Re-render list to highlight active
    renderTraceList(allTraces);

    const detail = document.getElementById('detail');
    detail.innerHTML = '<div class="loading">Loading trace…</div>';

    const data = await fetchJSON(`${API}/api/traces/${id}`);
    renderDetail(data.trace, data.spans, data.events);
  }

  // ── Render trace detail ───────────────────────────────────────

  function renderDetail(trace, spans, events) {
    const dur = trace.endTime ? fmt(trace.endTime - trace.startTime) : 'running';
    const started = new Date(trace.startTime).toLocaleString();

    // Build span tree
    const spanTree = buildSpanTree(spans);

    const topFailures = events.filter(e => e.name === 'error').slice(0, 5);

    document.getElementById('detail').innerHTML = `
      <div class="detail-header">
        <div>
          <div class="detail-title">${esc(trace.name)}</div>
          <div class="detail-meta">
            <span>Agent: <strong>${esc(trace.agentName)}</strong></span>
            <span>ID: <code>${esc(trace.id)}</code></span>
            <span>Started: ${started}</span>
            <span>Duration: ${dur}</span>
          </div>
        </div>
        <span class="status-badge ${trace.status}" style="font-size:13px;padding:4px 12px">${trace.status}</span>
      </div>

      ${spans.length ? `
        <div class="section-title">Spans (${spans.length})</div>
        <div class="span-tree">${spanTree}</div>
      ` : ''}

      ${topFailures.length ? `
        <div class="section-title">Events</div>
        ${topFailures.map(e => `
          <div style="font-size:12px;color:var(--error);padding:4px 0">
            ✗ ${esc(e.name)} — ${esc(JSON.stringify(e.data ?? {}))}
          </div>
        `).join('')}
      ` : ''}
    `;
  }

  function buildSpanTree(spans) {
    if (!spans.length) return '<div class="loading">No spans.</div>';

    const byId = {};
    const children = {};

    spans.forEach(s => {
      byId[s.id] = s;
      const p = s.parentSpanId || '__root__';
      if (!children[p]) children[p] = [];
      children[p].push(s);
    });

    function renderSpan(span, depth) {
      const indent = '│  '.repeat(depth);
      const connector = '├─ ';
      const icon = span.status === 'ok' ? '✓' : span.status === 'error' ? '✗' : '●';
      const dur = span.endTime ? fmt(span.endTime - span.startTime) : '…';

      const attrs = span.attributes
        ? Object.entries(span.attributes)
            .filter(([, v]) => v !== undefined && v !== null)
            .map(([k, v]) => `<span class="attr-tag"><span class="attr-key">${esc(k)}=</span><span class="attr-val">${esc(v)}</span></span>`)
            .join('')
        : '';

      const kids = (children[span.id] || []).map(c => renderSpan(c, depth + 1)).join('');

      return `
        <div class="span-node">
          <div class="span-row">
            <span class="span-indent">${esc(indent + connector)}</span>
            <span class="span-icon ${span.status}">${icon}</span>
            <span class="span-name ${span.status === 'error' ? 'error' : ''}">${esc(span.name)}</span>
            <span class="span-duration">${dur}</span>
          </div>
          ${attrs ? `<div class="span-attrs">${attrs}</div>` : ''}
          ${span.errorMessage ? `<div class="span-error-msg">↳ ${esc(span.errorMessage)}</div>` : ''}
          ${kids}
        </div>`;
    }

    const roots = children['__root__'] || [];
    return roots.map(s => renderSpan(s, 0)).join('');
  }

  // ── Init ──────────────────────────────────────────────────────

  async function init() {
    await Promise.all([loadAgents(), loadStats(), loadTraces()]);
  }

  document.getElementById('btn-refresh').addEventListener('click', () => {
    loadStats();
    loadTraces();
  });

  ['filter-agent', 'filter-status', 'filter-since'].forEach(id => {
    document.getElementById(id).addEventListener('change', () => {
      loadStats();
      loadTraces();
    });
  });

  // Auto-refresh every 10s
  setInterval(() => {
    loadStats();
    loadTraces();
  }, 10000);

  init();

  // expose for onclick
  window.selectTrace = selectTrace;
</script>
</body>
</html>
