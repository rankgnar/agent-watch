services:
  agent-watch:
    image: ghcr.io/rankgnar/agent-watch:latest
    # Alternatively, build from source:
    # build: .
    container_name: agent-watch
    restart: unless-stopped
    ports:
      - "${AGENT_WATCH_HOST_PORT:-4200}:4200"
    volumes:
      # Persist SQLite database across container restarts
      - agent-watch-data:/data
    environment:
      # Path to the SQLite database inside the container (default: /data/agent-watch.db)
      AGENT_WATCH_DB_PATH: ${AGENT_WATCH_DB_PATH:-/data/agent-watch.db}

      # Port the dashboard HTTP server listens on inside the container
      AGENT_WATCH_PORT: ${AGENT_WATCH_PORT:-4200}

      # Optional: secret key used to sign dashboard session tokens
      # AGENT_WATCH_SECRET: ${AGENT_WATCH_SECRET:-change-me-in-production}

      # Optional: restrict dashboard access to specific CORS origins
      # AGENT_WATCH_CORS_ORIGIN: ${AGENT_WATCH_CORS_ORIGIN:-http://localhost:4200}

      # Optional: log level (debug | info | warn | error)
      # LOG_LEVEL: ${LOG_LEVEL:-info}

      # Optional: Node.js environment
      NODE_ENV: ${NODE_ENV:-production}

volumes:
  agent-watch-data:
    driver: local
